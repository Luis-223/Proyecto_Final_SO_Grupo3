# /etc/apache2/sites-available/sysmonitor.conf
# VirtualHost de desarrollo (VM). En el VPS, certbot --apache crea la versión :443.
<VirtualHost *:80>
    ServerName sysmonitor.local
    ServerAdmin webmaster@localhost

    DocumentRoot /var/www/sysmonitor-web/public

    <Directory /var/www/sysmonitor-web/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    # Nada fuera de /public es accesible desde el navegador (.env, database/, storage/).
    # Apache aplica primero la ruta más corta, así que /public (arriba) sigue permitido.
    <Directory /var/www/sysmonitor-web>
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/sysmonitor_error.log
    CustomLog ${APACHE_LOG_DIR}/sysmonitor_access.log combined
</VirtualHost>
